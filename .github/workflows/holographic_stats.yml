name: Generate Custom Stats SVG

on:
    schedule:
        - cron: "0 */12 * * *" # Runs automatically every 12 hours
    workflow_dispatch: # Allows you to run it manually
    push:
        branches:
            - main

jobs:
    generate:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.x"

            - name: Generate Holographic SVG
              run: python .github/scripts/generate_holographic_stats.py
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit and push SVG
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "Automated custom holographic stats update"
